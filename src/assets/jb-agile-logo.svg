<svg width="240" height="56" viewBox="0 0 300 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wm-main { fill: #e8e6f8; }
      .wm-sub  { fill: #8878e8; }
      .wm-div  { fill: #4a3d80; }
      .ic-bg   { fill: #6c5ce7; }
      .ic-bd   { fill: none; stroke: #8878e8; }
      .arc     { stroke: #ffffff; }
      .chev    { stroke: #a99af4; }
      .dot     { fill: #7b6fe8; }
    </style>
  </defs>

  <!-- Icon tile -->
  <rect x="0" y="8" width="56" height="56" rx="12" class="ic-bg"/>
  <rect x="0" y="8" width="56" height="56" rx="12" class="ic-bd" stroke-width="0.8"/>

  <!-- Arc: cx=28, cy=36, r=20 -->
  <path d="M 28 16 A 20 20 0 1 0 45 26" fill="none" class="arc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dot at arc start -->
  <circle cx="28" cy="16" r="2" class="dot"/>

  <!-- >> chevrons -->
  <polyline points="19,28 26,36 19,44" fill="none" class="chev" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="28,28 35,36 28,44" fill="none" class="chev" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- JB -->
  <text x="68" y="57"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="52" font-weight="200" letter-spacing="-1"
    class="wm-main">JB</text>

  <!-- Vertical divider -->
  <rect x="132" y="8" width="1" height="58" class="wm-div"/>

  <!-- Agile -->
  <text x="142" y="34"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26" font-weight="700" letter-spacing="1"
    class="wm-sub">Agile</text>

  <!-- Development -->
  <text x="142" y="61"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="22" font-weight="300" letter-spacing="0.5"
    class="wm-main">Development</text>

</svg>
